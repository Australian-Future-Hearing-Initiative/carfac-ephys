name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Format & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # Cheap and first: fails in a second if pyproject.toml changed without `uv lock`.
      - name: Lock file is in sync with pyproject.toml
        run: uv lock --check
      - name: Install dependencies
        run: uv sync --locked
      # Formatting is strict: any drift from `ruff format` fails the build.
      - name: ruff format --check
        run: uv run ruff format --check --diff .
      - name: ruff check
        run: uv run ruff check --output-format=github .
      - name: pyrefly check
        run: uv run pyrefly check
      - name: How to fix locally
        if: failure()
        run: |
          {
            echo "### Fix locally"
            echo '```bash'
            echo "uv run ruff format .        # fix formatting"
            echo "uv run ruff check --fix .   # apply safe lint fixes"
            echo "uv run pyrefly check        # type errors"
            echo "uv run pre-commit run --all-files"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Run Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Run test suite
        run: uv run pytest -v
